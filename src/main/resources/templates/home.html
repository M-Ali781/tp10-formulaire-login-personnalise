<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accueil</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8fafc; margin: 40px auto; max-width: 650px; padding: 25px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        ul { list-style-type: none; padding: 0; margin: 20px 0; }
        li { margin: 12px 0; }
        li a { display: block; padding: 12px 20px; background: #e0e7ff; color: #3730a3; text-decoration: none; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
        li a:hover { background: #c7d2fe; }
        .logout-section { margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .btn-logout { background-color: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-logout:hover { background-color: #dc2626; }
        .info-box { background: #f1f5f9; padding: 10px 15px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 20px; color: #475569; }
    </style>
</head>
<body>
<h2>Bienvenue dans l’application sécurisée</h2>
<div class="info-box" th:if="${username}">
    👤 Utilisateur connecté : <strong th:text="${username}">user</strong> | Rôles : <code th:text="${roles}">[ROLE_USER]</code>
</div>
<p>Connexion réussie ! Choisissez votre espace :</p>

<ul>
    <li><a th:href="@{/user/dashboard}">👤 Espace Utilisateur (Accessible aux rôles USER et ADMIN)</a></li>
    <li><a th:href="@{/admin/dashboard}">👑 Espace Administrateur (Réservé au rôle ADMIN)</a></li>
</ul>

<div class="logout-section">
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-logout">Se déconnecter</button>
    </form>
</div>
</body>
</html>
