<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Espace Administrateur</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8fafc; margin: 40px auto; max-width: 650px; padding: 25px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #b45309; border-bottom: 2px solid #fde68a; padding-bottom: 10px; }
        .alert-admin { background-color: #fef3c7; border-left: 4px solid #f59e0b; padding: 12px 16px; margin: 15px 0; border-radius: 4px; color: #92400e; }
        .nav-links { margin-top: 25px; display: flex; gap: 15px; }
        .nav-links a, .btn-logout { text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; }
        .btn-home { background: #e2e8f0; color: #334155; }
        .btn-logout { background: #ef4444; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<h2>👑 Espace Administrateur</h2>
<div class="alert-admin">
    <p>Section réservée aux utilisateurs ayant le rôle <strong>ADMIN</strong>.</p>
</div>

<p th:if="${username}">Connecté en tant que : <strong th:text="${username}">admin</strong> (<span th:text="${roles}">[ROLE_ADMIN]</span>)</p>

<div class="nav-links">
    <a th:href="@{/home}" class="btn-home">← Retour à l'accueil</a>
    <form th:action="@{/logout}" method="post" style="display:inline;">
        <button type="submit" class="btn-logout">Déconnexion</button>
    </form>
</div>
</body>
</html>
